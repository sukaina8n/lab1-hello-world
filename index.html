<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello World</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            margin: 0;
            padding: 50px;
        }

        .box {
            max-width: 700px;
            margin: auto;
            background-color: white;
            padding: 35px;
            border: 1px solid #ddd;
            border-radius: 8px;
            text-align: center;
        }

        h1 {
            margin-bottom: 10px;
        }

        h2 {
            font-weight: normal;
            margin-top: 0;
        }

        .about {
            margin-top: 30px;
            padding: 20px;
            background-color: #f7f7f7;
            border-left: 4px solid #555;
            text-align: left;
        }

        p {
            line-height: 1.6;
        }
    </style>
</head>

<body>

    <div class="box">
        <h1>Hello World!</h1>
        <h2>My Name is Sukaina</h2>

        <p>Welcome to my Web Engineering Lab 1.</p>

        <div class="about">
            <h3>About Sherlock Holmes</h3>
            <p>
                Sherlock Holmes is a famous fictional detective created by
                Sir Arthur Conan Doyle. He is known for his intelligence,
                observation skills, and ability to solve difficult mysteries.
            </p>
        </div>
    </div>

</body>
</html>
